name: Pipeline
run-name: by ${{ github.actor }} 
on:
  push:
    branches: [main, dev]
  pull_request: 
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
  
    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Clone repo
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        
      - name: Typecheck
        run: pnpm typecheck
        
      - name: Done
        run: echo "Quality check completed on ${{ github.ref }} with ${{ job.status }}."
        
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality-gate
    
    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Clone repo
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test
        
      - name: Done
        run: echo "Tests completed on ${{ github.ref }} with ${{ job.status }}."

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality-gate, test]
    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Clone repo
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Done
        run: echo "Building completed on ${{ github.ref }} with ${{ job.status }}."
  
